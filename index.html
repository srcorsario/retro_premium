<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Retro Components</title>
    <!-- Cargamos los estilos por separado -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/componentes.css">
</head>
<body>
    <div class="container">
        <h1>🎮 Gestión de Componentes Retro</h1>
        
        <div class="card">
            <h2>Componentes Principales</h2>
            <table>
                <thead id="thead-principal"></thead>
                <!-- Este tbody será rellenado por ui.js -->
                <tbody id="tbody-principal"></tbody>
            </table>
        </div>

        <div class="card">
            <h2>🛠️ Módulo de Pedidos (Próximamente)</h2>
            <button id="btn-simular-pedido" class="btn">Simular Pedido</button>
            <p id="msg-pedidos"></p>
        </div>
    </div>

    <!-- IMPORTANTE: type="module" es necesario para poder usar import/export -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
